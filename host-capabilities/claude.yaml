schema_version: 1
host: claude
updated: 2026-10-14
support_status: supported_local_plugin_package
parity_role: first_additional_host
contract:
  supported_means:
    - A Claude plugin package can be generated from the same core workflow sources.
    - The plugin exposes setup, phase delivery, review, remediation, model policy, and finalization guidance.
    - Repository-local state, logs, reviews, alerts, and validation remain authoritative.
  parity_target: core_workflow_required_parity_with_host_specific_fallbacks
runtime_boundary:
  candidate_version: 0.3.0
  python: ">=3.12,<3.13"
  hook_executable: python3.12_on_host_path
  hook_failure_policy_requires: Claude_Code_v2.1.295_or_later
  dependencies: stdlib_only
  locks: cooperative_posix_directory_locks
  tested_host_versions: none_offline_contracts_only
  prompt_template_version: 3
  policy_contract_version: 2
  semantic_evidence_version: 1
capabilities:
  skill_instruction_packaging:
    parity_level: required_parity
    status: supported
    evidence:
      - adapters/claude/
      - dist/claude/
  agent_or_subagent_support:
    parity_level: host_specific_enhancement
    status: packaged_reviewer_agent
    fallback: same-context review with explicit limitation, or an external review prompt artifact
    evidence:
      - dist/claude/agents/reviewer.md
  hooks_or_guards:
    parity_level: host_specific_enhancement
    status: generated_plugin_hooks
    fallback: repository validators, blocked state, and local alert files
    limitation: guardrails and reminders only; not complete DLP or host permission enforcement
    evidence:
      - dist/claude/hooks/hooks.json
      - dist/claude/hooks/roadmap_delivery_safety.py
      - tests/test_claude_hooks.py
  live_smoke_harness:
    parity_level: host_specific_enhancement
    fallback: package layout, manifest, demo fixture validation, and hook guard checks
    status: optional_local_smoke
    default: offline_package_checks
    offline_parity: plugin_layout_manifest_demo_fixture_hook_guard_validation
    live_status_source: scripts/host_smoke.py live_status
    live_status_scope: binary_help_only_not_scheduler_evidence
    evidence_categories: offline_package_binary_availability_offline_simulation_real_scheduler_independent_agent
    real_scheduler_check: skipped_by_harness_requires_opt_in_update_and_readback
    independent_agent_check: skipped_when_unavailable_separate_raw_fixture_evaluation
    mandatory_behavioral_suite: tests/test_runtime_scenarios.py extracted_release_offline_scheduler_double
    skipped_result_visibility: required
    nightly_workflow: .github/workflows/host-smoke-nightly.yml workflow_dispatch opt-in
    live_binary_check: optional
    skip_reason_when_missing: claude_binary_not_found
    guard: requires temporary CLAUDE_PLUGIN_DIR and --isolated-home
    evidence:
      - scripts/host_smoke.py
      - tests/test_host_smoke.py
      - docs/host-smoke-checks.md
      - docs/installing-claude.md
  recurring_automation:
    parity_level: unsupported_by_host
    status: not_assumed
    fallback: manual or host-runner scheduled execution against repository artifacts
  model_selection:
    parity_level: required_parity
    status: provider_neutral_runner_contract
    guard: provider-neutral phase_model_policy.json maps model roles to host runner configuration
  filesystem_sandboxing:
    parity_level: required_parity
    status: host_provided_when_available
    guard: stop for permission-gated writes and preserve unrelated worktree changes
  approval_boundaries:
    parity_level: required_parity
    status: required
    protected_operations:
      - publication
      - promotion
      - destructive_git
      - credentials
      - installed_plugin_sync
  mcp_or_tool_integration:
    parity_level: host_specific_enhancement
    status: supported_when_tools_are_available
    fallback: local CLI validation and file-backed inspection
  terminal_status_update:
    parity_level: required_parity
    status: host_tool_action_when_available
    operation: readback_and_status_only_pause
    source_of_truth: acknowledged_host_readback
    file_backend: unsupported_unless_host_explicitly_documents_authoritative_file_contract
    concurrency: adapter_must_compare_observed_revision_and_make_request_id_idempotent
    settings: preserve_full_configuration_except_status_and_host_updated_at
    fallback: durable_local_alert_intent_and_action_request_with_specific_required_action
    evidence:
      - src/roadmap_delivery/automation.py
      - tests/test_runner_updates.py
      - tests/test_terminal_closeout.py
