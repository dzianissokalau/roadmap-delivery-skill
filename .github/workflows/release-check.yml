name: Release Check

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-artifact:
    name: Build Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install offline test build dependencies
        run: python3 -m pip install 'setuptools>=68' wheel

      - name: Install package
        run: python3 -m pip install -e .

      - name: Run roadmap delivery release validation action
        uses: ./.github/actions/roadmap-delivery-validate
        with:
          repo-root: .
          roadmap-slug: framework-core-and-release-readiness
          automation-id: framework-core-and-release-readiness
          strict: 'true'
          allow-warning: missing_automation_config,current_branch_name_mismatch,worktree_dirty
          adapter-check: 'true'
          privacy-scan: 'true'
          release-check: 'true'
          report-format: json
          report-file: ${{ runner.temp }}/roadmap-delivery-release-validate.json

      - name: Run release checks
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/build_codex_package.py --check
          python3 scripts/check_release_privacy.py --repo-root .
          python3 scripts/build_release.py --check

      - name: Run mandatory offline behavioral acceptance
        env:
          PIP_NO_INDEX: '1'
          PYTHONNOUSERSITE: '1'
        run: python3 -m unittest tests.test_runtime_scenarios tests.test_portable_install tests.test_terminal_closeout tests.test_runtime_migrations tests.test_host_smoke -v

      - name: Build local release artifacts
        run: python3 scripts/build_release.py --output-dir dist --json

      - name: Upload release-check artifact
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-delivery-release-artifacts
          path: dist/*
