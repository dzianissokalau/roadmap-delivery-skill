name: Documentation gap
description: Point out missing, confusing, or stale documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Please avoid posting private automation logs, review transcripts, local paths, credentials, or release bundles. Redact examples before sharing.
  - type: textarea
    id: page
    attributes:
      label: Page or file
      description: Which README, docs page, package README, or roadmap section needs work?
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Gap
      description: What is missing, misleading, hard to follow, or out of date?
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks first setup
        - Blocks install or package verification
        - Blocks contribution or review
        - Causes compatibility confusion
        - Minor clarity issue
    validations:
      required: true
  - type: textarea
    id: safe_example
    attributes:
      label: Safe example
      description: Add a redacted example or suggested wording if helpful.
